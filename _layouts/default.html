<!doctype html>
<html lang="{{ site.lang | default: 'de-DE' }}">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  {% if page.summary %}
    <meta
      name="description"
      content="{{ page.summary | strip_html | escape }}">
  {% else %}
    <meta
      name="description"
      content="{{ site.description | escape }}">
  {% endif %}

  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}">
</head>

<body>

  {% include header.html %}

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      Aulonia · Fantasy World Wiki
    </p>
  </footer>

</body>
</html>
