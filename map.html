<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Guides</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
    const map = new mapboxgl.Map({
        accessToken: 'pk.eyJ1IjoiZGljZW1vdXNlIiwiYSI6ImNtb2V0Nzc2ajBmN3UycnNjZDU4c2g5MWMifQ.DFT7wJMNpU8UhL2aa72-fQ',
        container: 'map',
        style: 'mapbox://styles/dicemouse/cmskmcjkj00x201s94yda40et', //Use style of Traia 'mapbox://styles/mapbox/standard', // Use the standard style for the map
        zoom: 1, // initial zoom level, 0 is the world view, higher values zoom in
        center: [30, 15] // center the map on this longitude and latitude
    });

    map.addControl(new mapboxgl.NavigationControl());

</script>

</body>
</html>
